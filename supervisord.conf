[supervisord]
nodaemon=true
user=root
pidfile=/var/run/supervisord.pid
logfile=/data/logs/vibestack/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:dbus-system]
command=bash -c 'mkdir -p /run/dbus && rm -f /run/dbus/pid && dbus-uuidgen --ensure && exec dbus-daemon --system --nofork --nopidfile'
autorestart=true
redirect_stderr=true
stdout_logfile=/data/logs/vibestack/services/dbus-system.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=50
startsecs=2

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 %(ENV_RESOLUTION)sx24 -nolisten tcp -auth /run/vibestack/Xauthority
user=vibe
environment=HOME="/home/vibe",USER="vibe",XAUTHORITY="/run/vibestack/Xauthority"
autorestart=true
redirect_stderr=true
stdout_logfile=/data/logs/vibestack/services/xvfb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=100
startsecs=5

[program:x11vnc]
command=bash -c 'sleep 8 && exec x11vnc -display :0 -auth /run/vibestack/Xauthority -forever -nopw -shared -xrandr resize -rfbport %(ENV_VNC_PORT)s -listen 127.0.0.1'
user=vibe
environment=HOME="/home/vibe",USER="vibe",DISPLAY=":0",XAUTHORITY="/run/vibestack/Xauthority"
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/data/logs/vibestack/services/x11vnc.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=200
startsecs=10

[program:novnc]
command=bash -c 'sleep 12 && exec websockify --heartbeat=30 --auth-plugin=websockify_auth.ProxyOnly --auth-source=vibestack-nginx-proxy-v1 127.0.0.1:%(ENV_NOVNC_PORT)s 127.0.0.1:%(ENV_VNC_PORT)s'
user=vibe
environment=PYTHONPATH="/usr/share/vibestack-proxy"
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/data/logs/vibestack/services/novnc.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=300
startsecs=15

# Native clients use a separate x11vnc listener with PAM-backed Unix login.
# This preserves the full Linux password and does not change the passwordless,
# nginx-confined browser RFB path above. The host publishes it only explicitly.
[program:native-vnc]
command=bash -c 'sleep 12 && exec x11vnc -display :0 -auth /run/vibestack/Xauthority -forever -shared -noshm -unixpw vibe -rfbport 5901 -listen 0.0.0.0'
user=root
environment=HOME="/root",DISPLAY=":0",XAUTHORITY="/run/vibestack/Xauthority"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/data/logs/vibestack/services/native-vnc.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=305
startsecs=15

[program:ssh]
command=/usr/sbin/sshd -D -e -f /etc/ssh/sshd_config_vibestack
user=root
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/data/logs/vibestack/services/ssh.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=310
startsecs=3

[program:xfce4]
command=bash -c 'sleep 15 && cd /home/vibe && /home/vibe/xfce-startup'
user=vibe
environment=DISPLAY=":0",HOME="/home/vibe",USER="vibe",SHELL="/bin/bash",XAUTHORITY="/run/vibestack/Xauthority",XDG_RUNTIME_DIR="/run/vibestack/runtime"
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/data/logs/vibestack/services/xfce4.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=400
startsecs=18

[program:ttyd]
command=/usr/bin/ttyd -i 127.0.0.1 -p %(ENV_TTYD_PORT)s -O -H X-VibeStack-Proxy --writable -t disableResizeOverlay=1 -t disableLeaveAlert=1 -t titleFixed=VibeStack --cwd /home/vibe tmux new-session -A -s main
user=vibe
environment=HOME="/home/vibe",USER="vibe",SHELL="/bin/bash",DISPLAY=":0",XAUTHORITY="/run/vibestack/Xauthority",XDG_RUNTIME_DIR="/run/vibestack/runtime"
autorestart=true
redirect_stderr=true
stdout_logfile=/data/logs/vibestack/services/ttyd.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=500
startsecs=5

[program:vibestack-setup]
command=/usr/bin/python3 /usr/share/vibestack/server.py
directory=/home/vibe
user=vibe
environment=HOME="/home/vibe",USER="vibe",SETUP_PORT="%(ENV_SETUP_PORT)s",VIBESTACK_COMMON_ROOT="/usr/share/vibestack-common"
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/data/logs/vibestack/services/vibestack-setup.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=550
startsecs=3

[program:vibestack-control]
command=/usr/bin/python3 /usr/share/vibestack-control/server.py
directory=/home/vibe
user=vibe
environment=HOME="/home/vibe",USER="vibe",DISPLAY=":0",XAUTHORITY="/run/vibestack/Xauthority",CONTROL_PORT="%(ENV_CONTROL_PORT)s",VIBESTACK_COMMON_ROOT="/usr/share/vibestack-common"
autorestart=true
redirect_stderr=true
stdout_logfile=/data/logs/vibestack/services/vibestack-control.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=560
startsecs=3

[program:vibestack-automation]
command=/usr/bin/python3 /usr/share/vibestack-automation/server.py
directory=/home/vibe
user=vibe
environment=HOME="/home/vibe",USER="vibe",DISPLAY=":0",XAUTHORITY="/run/vibestack/Xauthority",XDG_RUNTIME_DIR="/run/vibestack/runtime",AUTOMATION_PORT="%(ENV_AUTOMATION_PORT)s",AUTOMATION_TOKEN_FILE="/home/vibe/.vibestack/automation.token",AUTOMATION_AUDIT_LOG="/data/logs/vibestack/automation-audit.jsonl",AUTOMATION_SESSION_ENV_FILE="/run/vibestack/session.env",VIBESTACK_COMMON_ROOT="/usr/share/vibestack-common"
umask=0027
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/data/logs/vibestack/services/vibestack-automation.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=570
startsecs=3

[program:code-server]
command=/usr/bin/code-server --bind-addr 127.0.0.1:8443 --auth none --disable-telemetry /projects
directory=/projects
user=vibe
environment=HOME="/home/vibe",USER="vibe",SHELL="/bin/bash",XDG_RUNTIME_DIR="/run/vibestack/runtime"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/data/logs/vibestack/services/code-server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=580
startsecs=5

[program:vibestack-service]
command=/usr/local/bin/vibestack-service serve
directory=/home/vibe
user=vibe
environment=HOME="/home/vibe",USER="vibe"
umask=0077
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/data/logs/vibestack/services/vibestack-service.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=590
startsecs=3

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
redirect_stderr=false
stdout_logfile=/data/logs/vibestack/nginx/access.jsonl
stdout_logfile_maxbytes=25MB
stdout_logfile_backups=4
stderr_logfile=/data/logs/vibestack/nginx/error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
priority=600
startsecs=5
