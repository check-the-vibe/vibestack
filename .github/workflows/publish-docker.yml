name: Publish Docker image

on:
  workflow_dispatch:  # Manual trigger from GitHub UI
  pull_request:
  push:
    tags:
      - 'v*'          # Auto-run on version tags like v1.0.0
    branches:
      - main          # Auto-run on push to main

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write  # Needed to publish to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node for browser tests
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Go for client and runner tests
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/check-the-vibe/vibestack
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
          flavor: |
            latest=true

      - name: Run unit and source-contract tests
        run: bin/vibestack-dev test

      - name: Build acceptance image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: vibestack:test
          labels: ${{ steps.meta.outputs.labels }}

      # Ubuntu 24.04 restricts capabilities inside unprivileged user
      # namespaces by default. Flatpak's bubblewrap sandbox deliberately uses
      # those namespaces, including inside our opt-in nested-sandbox container.
      # This runner is an ephemeral, single-job VM; the production host and the
      # normal VibeStack launch remain unchanged and confined.
      - name: Permit nested Flatpak sandbox on disposable CI host
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run disposable container, onboarding, app and browser acceptance
        run: |
          for attempt in 1 2; do
            if bin/vibestack-dev accept vibestack:test; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            echo "::warning::Disposable acceptance failed; retrying once from clean state"
          done

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push the tested image
        if: github.event_name != 'pull_request'
        env:
          VIBESTACK_PUBLISH_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag vibestack:test "$tag"
            docker push "$tag"
          done <<< "$VIBESTACK_PUBLISH_TAGS"
