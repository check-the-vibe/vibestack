events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Access records go to stdout so Supervisor can rotate the persistent JSONL
    # file. Deliberately omit query strings, request bodies, and authorization.
    log_format vibestack_json escape=json
        '{"timestamp":"$time_iso8601",'
        '"requestId":"$request_id",'
        '"remoteAddress":"$remote_addr",'
        '"forwardedFor":"$http_x_forwarded_for",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"requestBytes":$request_length,'
        '"responseBytes":$body_bytes_sent,'
        '"requestSeconds":$request_time,'
        '"fetchSite":"$http_sec_fetch_site",'
        '"fetchMode":"$http_sec_fetch_mode",'
        '"fetchDest":"$http_sec_fetch_dest",'
        '"userAgent":"$http_user_agent"}';
    access_log /dev/stdout vibestack_json;
    error_log  /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compress first-load shell, noVNC module, setup, and documentation-like
    # text responses. WebSocket/RFB traffic is upgraded and unaffected.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/manifest+json image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Host is a security boundary for otherwise same-origin, single-user
    # surfaces. Permit local development and Tailscale MagicDNS names only;
    # a hostile DNS name resolving to this listener must not reach any route.
    map $http_host $vibestack_host_allowed {
        default 0;
        "~*^(?:localhost|127\.0\.0\.1)(?::[0-9]{1,5})?$" 1;
        "~*^\[::1\](?::[0-9]{1,5})?$" 1;
        "~*^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.){2,}ts\.net(?::[0-9]{1,5})?$" 1;
        include /run/vibestack/nginx-hosts.map;
    }

    # Match an optional browser Origin to the exact request authority. The
    # scheme may differ because Tailscale terminates HTTPS before proxying to
    # this HTTP listener. Backreferences keep two valid-but-different tailnet
    # names from being treated as same-origin.
    map "$http_origin|$http_host" $vibestack_origin_allowed {
        default 0;
        "~^\|" 1;
        "~*^https?://([^/@?#|,\s]+)\|\1$" 1;
    }

    # A browser opened from another site or an extension legitimately marks
    # its initial top-level navigation cross-site. Permit only safe top-level
    # GET/HEAD documents in that case; subresources and every mutation still
    # require absent, none, or same-origin fetch metadata.
    map "$request_method|$http_sec_fetch_site|$http_sec_fetch_mode|$http_sec_fetch_dest" $vibestack_fetch_site_allowed {
        default 0;
        "~*^(?:GET|HEAD)\|(?:cross-site|same-site)\|navigate\|(?:document|empty)$" 1;
        "~*^[A-Z]+\|(?:none|same-origin)\|[^|]*\|[^|]*$" 1;
        "~*^[A-Z]+\|\|[^|]*\|[^|]*$" 1;
    }

    server {
        listen 80;
        server_name _;
        absolute_redirect off;

        if ($vibestack_host_allowed = 0) {
            return 421;
        }
        if ($vibestack_origin_allowed = 0) {
            return 403;
        }
        if ($vibestack_fetch_site_allowed = 0) {
            return 403;
        }

        # The stable entrypoint is a small chooser. It keeps Desktop, Terminal,
        # and Setup discoverable without coupling launch behavior to setup state.
        location = / {
            root /usr/share/vibestack/desktop;
            try_files /launcher.html =404;
            default_type text/html;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'none'; form-action 'self'" always;
        }

        location = /launcher.css {
            alias /usr/share/vibestack/desktop/launcher.css;
            default_type text/css;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location = /launcher.js {
            alias /usr/share/vibestack/desktop/launcher.js;
            default_type application/javascript;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        # One canonical, version-matched operating guide is available to
        # in-container agents and authorized agents on the host or tailnet.
        location = /AGENTS.md {
            alias /usr/share/doc/vibestack/AGENTS.md;
            default_type text/markdown;
            charset utf-8;
            charset_types text/markdown;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location = /AUTOMATION.md {
            alias /usr/share/doc/vibestack/AUTOMATION.md;
            default_type text/markdown;
            charset utf-8;
            charset_types text/markdown;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location = /CLI.md {
            alias /usr/share/doc/vibestack/CLI.md;
            default_type text/markdown;
            charset utf-8;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location = /RUNNER.md {
            alias /usr/share/doc/vibestack/RUNNER.md;
            default_type text/markdown;
            charset utf-8;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location = /cli.sh {
            alias /usr/share/vibestack/cli.sh;
            default_type text/x-shellscript;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location = /skills/vibestack/SKILL.md {
            alias /usr/share/doc/vibestack/skills/vibestack/SKILL.md;
            default_type text/markdown;
            charset utf-8;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location = /.well-known/vibestack {
            proxy_pass http://127.0.0.1:7999/api/discovery;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Request-ID $request_id;
            proxy_buffering off;
        }

        # First-boot wizard. Also the place to add components later.
        location = /setup {
            return 302 /setup/;
        }

        location /setup/ {
            proxy_pass http://127.0.0.1:7999/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # Authenticated automation is a separate loopback service. Keep this
        # more-specific prefix ahead of the same-origin desktop control API.
        location = /api/v1/automation {
            client_max_body_size 16m;
            proxy_pass http://127.0.0.1:7997;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location ^~ /api/v1/automation/ {
            client_max_body_size 16m;
            proxy_pass http://127.0.0.1:7997;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Small, allowlisted bridge between the desktop shell and the local OS.
        location /api/v1/ {
            proxy_pass http://127.0.0.1:7998/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 60s;
        }

        # Browser terminal (ttyd)
        location /terminal/ {
            proxy_pass http://127.0.0.1:7681/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-VibeStack-Proxy vibestack-nginx-proxy-v1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # Optional browser editor. It is intentionally same-origin and has no
        # independent password because nginx's private origin is the boundary.
        location /editor/ {
            proxy_pass http://127.0.0.1:8443/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # VibeStack owns the visible desktop shell. It imports noVNC's RFB
        # protocol implementation from /novnc/ and connects here.
        location = /vnc {
            return 302 /vnc/;
        }

        location = /vnc/websockify {
            proxy_pass http://127.0.0.1:6080/websockify;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-VibeStack-Proxy vibestack-nginx-proxy-v1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        location /vnc/ {
            alias /usr/share/vibestack/desktop/;
            index index.html;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws://$http_host wss://$http_host; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'none'; form-action 'self'" always;
        }

        # Serve only the pinned noVNC protocol runtime. The upstream HTML UI is
        # intentionally unreachable: VibeStack owns the entire visible shell.
        location /novnc/core/ {
            alias /usr/share/novnc/core/;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location /novnc/vendor/ {
            alias /usr/share/novnc/vendor/;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location = /manifest.webmanifest {
            alias /usr/share/vibestack/desktop/manifest.webmanifest;
            default_type application/manifest+json;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location = /service-worker.js {
            alias /usr/share/vibestack/desktop/service-worker.js;
            default_type application/javascript;
            add_header Cache-Control "no-cache" always;
            add_header Service-Worker-Allowed "/" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location /icons/ {
            alias /usr/share/vibestack/desktop/icons/;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }
    }
}
